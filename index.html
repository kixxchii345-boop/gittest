body{

header{
position: sticky;    
top: 0;
width: 100%;    
color: #ffffff;
background-color: rgb(130, 208, 235);
border-radius: 10px;
padding: 10px;

}

header h1{
text-align: center;
font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

}

.topnav{
width: 100%;
background-color: rgba(91, 200, 237, 0.461);
padding: 5px 5px;
margin-bottom: 15px;
border-radius: 10px;
transition: transform 0.03 ease;
position: sticky;

}

.topnav ul{
list-style-type: none;
display: flex;
justify-content: center;
gap: 25px;

}

.topnav a{
color: #ffffff;
text-decoration: none;
font-weight: bold;
font-size: large;
padding: 6px 12px;
background: rgba(91, 200, 237, 0.461);
border: 2px;
border-radius: 4px;
transition: tranform 0.03 ease;

}

.topnav a:hover{
transform: translateY(-7);

}

.container{
max-width: 900px;
margin: 40px auto;
padding: 20px;
display: grid;
gap: 24px;

}

.card{
background: #ffffff;
border-radius: 16px;
padding: 24px;
box-shadow: 0 8px 20px rgb(0,0,0,0.08);
transition: transform 0.3s ease;
box-shadow: 0.3s ease;
overflow: hidden;

}

.card:hover{
transform: translateY(-6px);
box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);

}

.card h3{
margin-bottom: 12px;
text-align: center;

}

button{
padding: 10px 25px;
background-color: #233dff;
color: white;
border: none;
border-radius: 8px;
font-size: 16px;
cursor: pointer;
transition: 0.03s;

}

button a{
color: #ffffff;

}

button:hover{

transition:0.3s ease;

}

</style>
